[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GhostMyShit"
version = "0.1.0"
description = "LangGraph + browser-use + Telegram agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.55",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-core>=1.2.5,<2.0",
    "langchain-google-genai>=4.2,<5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-telegram-bot[rate-limiter]>=21.0",
    "browser-use==0.12.2",
    "google-genai>=1.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
GhostMyShit = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
