[tool.poetry]
name = "ghost-attend"
version = "1.0.0-dev"
description = "Autonomous university online lesson attendance via Telegram bot"
authors = ["Seyfosphere"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Bot
python-telegram-bot = {version = "^21.0", extras = ["job-queue"]}

# Web Agent
browser-use = "^0.1.40"
playwright = "^1.44.0"

# LLM
anthropic = "^0.49.0"
openai = "^1.35.0"
google-generativeai = "^0.7.0"
langchain-google-genai = "*"
langchain-anthropic = "*"
langchain-openai = "*"

# API & Async
fastapi = "^0.111.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
httpx = "^0.27.0"

# Database
sqlalchemy = {version = "^2.0.0", extras = ["asyncio"]}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = {version = "^5.0.0", extras = ["hiredis"]}

# Task Queue
celery = {version = "^5.4.0", extras = ["redis"]}
apscheduler = "^3.10.0"

# Security
cryptography = "^42.0.0"

# Validation
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# Utilities
pillow = "^10.3.0"
python-dateutil = "^2.9.0"
pytz = "^2024.1"
structlog = "^24.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
respx = "^0.21.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "TCH"]
ignore = ["S101", "S104"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "browser_use.*",
    "apscheduler.*",
    "celery.*",
    "telegram.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
