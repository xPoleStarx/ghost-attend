version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    volumes:
      - ./src:/app/src  # Hot reload için mount
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: python -m src.bot.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghost_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes:
      - ./src:/app/src
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
      - postgres
    networks:
      - ghost_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghostattend
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghostdev123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghost_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghost_net

networks:
  ghost_net:
    driver: bridge
