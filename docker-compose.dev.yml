services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    volumes:
      - ./src:/app/src  # Hot reload için mount
      - ./data:/app/data
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: python -m src.bot.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghost_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes:
      - ./src:/app/src
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghost_net

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    command: python -m src.scheduler.main
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    env_file: .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghost_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghostattend}
      POSTGRES_USER: ${POSTGRES_USER:-ghost_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghost_net

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghost_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - bot
    networks:
      - ghost_net

networks:
  ghost_net:
    driver: bridge

volumes:
  postgres_data:
